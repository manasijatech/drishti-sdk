[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-stack-sdk"
version = "0.1.5"
description = "Python client for the Alpha API (/v1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Market-Stack" }]
dependencies = ["httpx>=0.27.0,<1", "pydantic>=2.0,<3"]
keywords = ["alpha-api", "sdk", "python", "http-client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["market_stack_sdk"]

[tool.hatch.build.targets.sdist]
include = ["market_stack_sdk", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
