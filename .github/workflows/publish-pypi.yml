name: Publish PyPI package

on:
  push:
    branches:
      - main
    paths:
      - "python/pyproject.toml"
      - ".github/workflows/publish-pypi.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check package version changed
        id: version
        working-directory: .
        run: |
          BASE="${{ github.event.before }}"
          NEW_VERSION=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('python/pyproject.toml').read_text())['project']['version'])")

          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE:python/pyproject.toml"; then
            echo "Package did not exist before this push."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show "$BASE:python/pyproject.toml" | python -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])")

          echo "old=$OLD_VERSION"
          echo "new=$NEW_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: steps.version.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
