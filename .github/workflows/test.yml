name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -q

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # Guzzle 7 (Laravel 12 and earlier) and Guzzle 8 (Laravel 13).
        guzzle: ['^7.8', '^8.0']
    name: php (${{ matrix.php }}, guzzle ${{ matrix.guzzle }})
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer require --no-interaction --no-progress --no-update "guzzlehttp/guzzle:${{ matrix.guzzle }}"
      - run: composer update --no-interaction --no-progress --with-all-dependencies
      - run: composer test
      - run: composer analyse
