name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - 'js/package.json'
      - '.github/workflows/publish-npm.yml'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check package version changed
        id: version
        working-directory: .
        run: |
          BASE="${{ github.event.before }}"
          NEW_VERSION=$(node -pe "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" js/package.json)

          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE:js/package.json"; then
            echo "Package did not exist before this push."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show "$BASE:js/package.json" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")

          echo "old=$OLD_VERSION"
          echo "new=$NEW_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test --if-present
      - run: npm publish
        if: steps.version.outputs.changed == 'true'
